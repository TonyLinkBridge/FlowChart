      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; color: #E0A62E; letter-spacing: 0.5px;">B</span>
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.1px;">深色控制台</span>
      <span style="font-size: 11px; color: #565B65;">Space Grotesk · 墨黑 · 发光琥珀</span>
    </div>
